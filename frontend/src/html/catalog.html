<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>

<header>
    <a class="logo" href="main.html">Trava</a>
    <nav>
        <ul>
            <li><a href="main.html">Главная</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li data-auth="out"><a href="login.html">Вход</a></li>
            <li data-auth="out"><a href="register.html">Регистрация</a></li>
            <li data-auth="in"><a href="profile.html">Профиль</a></li>
            <li data-auth="in"><a href="#" data-logout>Выйти</a></li>
        </ul>
    </nav>
</header>

<main class="catalog">
    <h1 class="title">Поиск мест и маршрутов</h1>
    <div class="catalog-header">
        <div class="header-actions">
            <button id="open-filters-btn" class="btn-filters">
                Фильтры ⚙️
            </button>
            <div id="add-place-btn-wrap">
                <button onclick="openAddPlaceModal()" class="btn-add-place" id="add-place-btn">+ Добавить место</button>
            </div>
        </div>
    </div>

    <section class="filters" id="filters" aria-label="Фильтры поиска">
        <div class="filters-header">
            <h2 class="filters-title">Фильтры поиска</h2>
            <button class="btn-clear-all" id="reset" type="button">Очистить все</button>
        </div>
        <div class="filters-grid">
            <div class="filter">
                <label for="q">Поиск по названию</label>
                <input id="q" type="text" placeholder="Например: Эйфелева башня, Лувр...">
            </div>

            <div class="filter">
                <label for="country">Страна</label>
                <select id="country">
                    <option value="">Любая страна</option>
                </select>
            </div>

            <div class="filter">
                <label for="city">Город</label>
                <select id="city" disabled>
                    <option value="">Любой город</option>
                </select>
            </div>

            <div class="filter">
                <label for="type">Тип места</label>
                <select id="type">
                    <option value="">Любой тип</option>
                    <option value="attraction">Достопримечательность</option>
                    <option value="restaurant">Ресторан</option>
                    <option value="hotel">Отель</option>
                </select>
            </div>

            <div class="filter">
                <label for="rating">Минимальный рейтинг</label>
                <select id="rating">
                    <option value="">Любой</option>
                    <option value="4.8">4.8+ ★★★★★☆</option>
                    <option value="4.5">4.5+ ★★★★★</option>
                    <option value="4.0">4.0+ ★★★</option>
                    <option value="3.5">3.5+ ★★☆</option>
                </select>
            </div>

            <div class="filter">
                <label class="favorites-label">
                    <input type="checkbox" id="favorites-only" class="favorites-checkbox">
                    <span class="favorites-icon">❤️</span>
                    <span class="favorites-text">Только избранное</span>
                </label>
            </div>
        </div>
    </section>

    <div id="results" class="cards"></div>

</main>

<!-- Модальное окно подтверждения удаления -->
<div id="confirm-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:15px; padding:30px; width:350px; text-align:center;">
        <h3 style="font-family:'Playfair Display',serif; color:#643411; margin-bottom:15px;" id="confirm-text">Вы уверены?</h3>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button id="confirm-yes" class="action-btn action-btn--danger">Удалить</button>
            <button onclick="closeConfirmModal()" class="action-btn action-btn--secondary">Отмена</button>
        </div>
    </div>
</div>

<!-- Модальное окно добавления места -->
<div id="add-place-modal" class="modal" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-content">
        <h2 id="modal-title" class="modal-header">Добавить место</h2>

        <form id="add-place-form">
            <div class="field-row">
                <label for="new-place-name">Название</label>
                <input id="new-place-name" type="text" placeholder="Название места" required>
            </div>
            <div class="field-row">
                <label for="new-place-desc">Описание</label>
                <textarea id="new-place-desc" placeholder="Описание" required></textarea>
            </div>
            <div class="field-row">
                <label for="new-place-country">Страна</label>
                <input id="new-place-country" type="text" placeholder="Например: Италия" required>
            </div>
            <div class="field-row">
                <label for="new-place-city">Город</label>
                <input id="new-place-city" type="text" placeholder="Например: Рим" required>
            </div>
            <div class="field-row">
                <label for="new-place-type">Тип</label>
                <select id="new-place-type" required>
                    <option value="ATTRACTION">Достопримечательность</option>
                    <option value="RESTAURANT">Ресторан</option>
                    <option value="HOTEL">Отель</option>
                </select>
            </div>
            <div class="field-row">
                <label for="new-place-file">Фото</label>
                <div class="file-row">
                    <input id="new-place-file" class="file-input" type="file" accept="image/*"
                           aria-describedby="file-hint">
                    <label class="btn-modal file-btn" for="new-place-file" role="button">Выбрать фото</label>
                    <span id="new-place-file-name" class="muted-hint"></span>
                </div>
                <small id="file-hint" class="muted-hint">Допустимые форматы: JPG, PNG, WEBP</small>
                <div id="new-place-preview" class="preview-container"></div>
            </div>

            <div class="modal-actions">
                <button type="button" onclick="closeAddPlaceModal()" class="btn-modal btn-modal-secondary">Отмена
                </button>
                <button type="submit" id="save-place-btn" class="btn-modal btn-modal-primary">Добавить</button>
            </div>
            <div id="add-place-message" class="message" role="alert" aria-live="polite"></div>
        </form>
    </div>
</div>

<script src="../js/session.js" defer></script>
<script src="../js/places-provider.js" defer></script>
<script src="../js/catalog-search.js" defer></script>

</body>
</html>
