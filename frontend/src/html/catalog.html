<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>

<header>
    <a class="logo" href="main.html">Trava</a>
    <nav>
        <ul>
            <li><a href="main.html">Главная</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li data-auth="out"><a href="login.html">Вход</a></li>
            <li data-auth="out"><a href="register.html">Регистрация</a></li>
            <li data-auth="in"><a href="profile.html">Профиль</a></li>
            <li data-auth="in"><a href="#" data-logout>Выйти</a></li>
        </ul>
    </nav>
</header>

<main class="catalog">

    <h1 class="title">Поиск мест и маршрутов</h1>
    <div style="text-align:center; margin-bottom:20px;" id="add-place-btn-wrap" style="display:none;">
        <button onclick="openAddPlaceModal()" class="btn-inline" id="add-place-btn">+ Добавить место</button>
    </div>

    <section class="filters" aria-label="Фильтры поиска">
        <div class="filters-grid">
            <div class="filter">
                <label for="q">Поиск</label>
                <input id="q" type="text" placeholder="Например: Эйфелева башня, Лувр ...">
            </div>

            <div class="filter">
                <label for="country">Страна</label>
                <select id="country">
                    <option value="">Любая</option>
                </select>
            </div>

            <div class="filter">
                <label for="city">Город</label>
                <select id="city" disabled>
                    <option value="">Любой</option>
                </select>
            </div>

            <div class="filter">
                <label for="type">Тип</label>
                <select id="type">
                    <option value="">Любой</option>
                    <option value="attraction">Достопримечательность</option>
                    <option value="restaurant">Ресторан</option>
                    <option value="hotel">Отель</option>
                </select>
            </div>

            <div class="filter">
                <label for="rating">Рейтинг от</label>
                <select id="rating">
                    <option value="">Любой</option>
                    <option value="4.8">4.8+</option>
                    <option value="4.5">4.5+</option>
                    <option value="4.0">4.0+</option>
                    <option value="3.5">3.5+</option>
                </select>
            </div>

            <div class="filter actions">
                <button id="reset" type="button" class="btn-inline">Сбросить</button>
            </div>
        </div>
    </section>

    <div id="results" class="cards"></div>

</main>

<script src="../js/session.js" defer></script>
<script src="../js/places-provider.js" defer></script>
<script src="../js/catalog-search.js" defer></script>
<!-- Модальное окно добавления места -->
<div id="add-place-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:15px; padding:30px; width:500px; max-width:90%; max-height:90vh; overflow-y:auto; position:relative;">
        <h2 style="font-family:'Playfair Display',serif; color:#643411; margin-bottom:20px;">Добавить место</h2>
        
        <div class="field-row">
            <label>Название</label>
            <input id="new-place-name" type="text" placeholder="Название места">
        </div>
        <div class="field-row">
            <label>Описание</label>
            <textarea id="new-place-desc" placeholder="Описание" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d6c2b3; min-height:80px; font-family:inherit; resize:vertical;"></textarea>
        </div>
        <div class="field-row">
            <label>Страна</label>
            <input id="new-place-country" type="text" placeholder="Например: Италия">
        </div>
        <div class="field-row">
            <label>Город</label>
            <input id="new-place-city" type="text" placeholder="Например: Рим">
        </div>
        <div class="field-row">
            <label>Тип</label>
            <select id="new-place-type" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d6c2b3;">
                <option value="ATTRACTION">Достопримечательность</option>
                <option value="RESTAURANT">Ресторан</option>
                <option value="HOTEL">Отель</option>
            </select>
        </div>
        <div class="field-row">
            <label>Фото</label>
            <div class="file-row">
                <input id="new-place-file" class="file-input" type="file" accept="image/*">
                <label class="btn-small file-btn" for="new-place-file" role="button">Выбрать фото</label>
                <span id="new-place-file-name" class="muted"></span>
            </div>
            <div id="new-place-preview" style="margin-top:10px;"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="save-place-btn" class="btn-small">Добавить</button>
            <button onclick="closeAddPlaceModal()" class="btn-small" style="background:#7a6656;">Отмена</button>
        </div>
        <div id="add-place-message" class="message" style="margin-top:10px;"></div>
    </div>
</div>
</body>
</html>
