<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
<header>
    <a class="logo" href="main.html">Trava</a>
    <nav>
        <ul>
            <li><a href="main.html">Главная</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li data-auth="out"><a href="login.html">Вход</a></li>
            <li data-auth="out"><a href="register.html">Регистрация</a></li>
            <li data-auth="in"><a href="profile.html">Профиль</a></li>
            <li data-auth="in"><a href="#" data-logout>Выйти</a></li>
        </ul>
    </nav>
</header>

<main class="profile-page">
    <div class="profile-grid">
        <section class="panel">
            <h1>Мой профиль</h1>
            <div class="avatar-wrap">
                <div class="avatar" id="avatar-box">
                    <img id="avatar-img" alt="Аватар" style="display:none;">
                    <span id="avatar-letter"></span>
                </div>
                <div class="muted" id="my-email"></div>
                <div class="field-row" style="width:100%;">
                    <label for="avatar-file">Аватарка</label>
                    <div class="file-row">
                        <input id="avatar-file" class="file-input" type="file" accept="image/*">
                        <label class="btn-small file-btn" for="avatar-file" role="button">Выбрать файл</label>
                        <span id="avatar-file-name" class="muted"></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>О себе</h2>
            <form id="profile-form" novalidate>
                <div class="field-row">
                    <label for="display-name">Имя</label>
                    <input id="display-name" type="text" placeholder="Как вас отображать">
                </div>

                <div class="field-row">
                    <label for="bio">Биография</label>
                    <textarea id="bio" placeholder="Коротко о себе"></textarea>
                </div>

                <div class="field-row">
                    <label>Интересы</label>
                    <div class="inline">
                        <input id="interest-input" type="text" placeholder="Например: горы, музеи, еда">
                        <button class="btn-small" id="add-interest" type="button">Добавить</button>
                    </div>
                    <div class="tags" id="interests"></div>
                </div>

                <button class="btn-small" type="submit">Сохранить</button>
                <div class="message" id="save-message" aria-live="polite"></div>
            </form>
        </section>

        <section class="panel" style="grid-column: 1 / -1;">
            <h2>Пользователи</h2>
            <div class="muted">Можно открыть чужой профиль и посмотреть интересы/комментарии.</div>
            <div style="margin:12px 0; display:flex; gap:10px;">
                <input id="user-search" type="text" placeholder="Поиск по имени..." 
                    style="flex:1; padding:10px; border-radius:8px; border:1px solid #d6c2b3;">
                <button id="user-search-btn" class="btn-small">Найти</button>
                <button id="user-search-reset" class="btn-small" style="background:#7a6656;">Сбросить</button>
            </div>
            <div class="user-list" id="user-list"></div>
        </section>

        <section class="panel" style="grid-column: 1 / -1;">
            <h2>Комментарии на моём профиле</h2>
            <div class="comments" id="my-comments"></div>
        </section>
        <section class="panel" style="grid-column: 1 / -1;">
            <section class="panel" style="grid-column: 1 / -1;">
                <h2>Избранные места</h2>
                <div class="user-list" id="favorites-list"></div>
            </section>
    </div>
</main>

<script src="../js/session.js" defer></script>
<script src="../js/profile-api.js" defer></script>
<script src="../js/profile.js" defer></script>

<div id="confirm-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:15px; padding:30px; width:350px; text-align:center;">
        <h3 style="font-family:'Playfair Display',serif; color:#643411; margin-bottom:15px;" id="confirm-text">Вы уверены?</h3>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button id="confirm-yes" class="btn-small">Удалить</button>
            <button onclick="closeConfirmModal()" class="btn-small" style="background:#7a6656;">Отмена</button>
        </div>
    </div>
</div>
</body>
</html>
